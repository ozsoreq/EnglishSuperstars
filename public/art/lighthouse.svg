<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c3e6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.45" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#c53b4a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#b8323f"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f93b8"/>
      <stop offset="1" stop-color="#565a85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.5" stop-color="#ffd84d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffc53d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="body"><path d="M98 96 L158 96 L170 214 L86 214 Z"/></clipPath>
  </defs>
  <!-- light beams -->
  <path d="M128 70 L10 40 L10 92 Z" fill="#ffe27a" opacity="0.35"/>
  <path d="M128 70 L246 40 L246 92 Z" fill="#ffe27a" opacity="0.35"/>
  <circle cx="128" cy="70" r="40" fill="url(#glow)"/>
  <!-- rocks -->
  <path d="M52 236 C 56 212, 84 204, 104 210 C 120 198, 150 200, 160 210 C 182 202, 206 214, 206 236 Z" fill="url(#rock)"/>
  <!-- tower body with stripes -->
  <path d="M98 96 L158 96 L170 214 L86 214 Z" fill="url(#tower)"/>
  <g clip-path="url(#body)">
    <rect x="80" y="112" width="100" height="22" fill="url(#red)"/>
    <rect x="80" y="156" width="100" height="22" fill="url(#red)"/>
    <rect x="80" y="200" width="100" height="16" fill="url(#red)"/>
  </g>
  <path d="M98 96 L158 96 L170 214 L86 214 Z" fill="none" stroke="#1d1f45" stroke-opacity="0.25" stroke-width="3"/>
  <!-- door and window -->
  <path d="M118 214 V196 a10 10 0 0 1 20 0 V214 Z" fill="#5b4bc4"/>
  <rect x="121" y="140" width="14" height="16" rx="7" fill="#3a3f7a"/>
  <!-- gallery -->
  <rect x="88" y="88" width="80" height="12" rx="5" fill="#3a3f7a"/>
  <!-- lamp room -->
  <rect x="106" y="56" width="44" height="34" rx="6" fill="#fff3a8" stroke="#3a3f7a" stroke-width="5"/>
  <rect x="122" y="56" width="5" height="34" fill="#3a3f7a" opacity="0.5"/>
  <!-- roof -->
  <path d="M100 58 L128 28 L156 58 Z" fill="url(#roof)"/>
  <circle cx="128" cy="26" r="6" fill="#3a3f7a"/>
  <!-- shine -->
  <path d="M104 112 L110 112 L104 204 L96 204 Z" fill="#ffffff" opacity="0.5"/>
</svg>
